<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/favicon-32x32.webp" />
    <link rel="icon" type="image/webp" sizes="16x16" href="/favicon-16x16.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#170f0d" />

    <title>Pizza Bona — Pizzeria artisanale à Lillebonne</title>
    <meta
      name="description"
      content="Pizza Bona, pizzeria artisanale à Lillebonne : pizzas maison, base tomate ou crème, sur place, à emporter ou en livraison. Appelez et venez déguster la meilleure pizza de Lillebonne."
    />
    <meta name="robots" content="index, follow" />
    <!-- URL réelle du site en ligne (aujourd'hui : GitHub Pages). À remplacer
         partout dans ce fichier + dans public/robots.txt, public/sitemap.xml et
         src/config/site.ts le jour où un vrai nom de domaine est acheté — et
         penser aussi à `base` dans vite.config.ts, qui redevient "/" sur un
         domaine propre. Attention : une balise canonical qui pointe vers un
         domaine inexistant empêche Google de référencer le site. -->
    <link rel="canonical" href="https://darik76.github.io/pizza-bona-site/" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Pizza Bona" />
    <meta property="og:title" content="Pizza Bona — Pizzeria artisanale à Lillebonne" />
    <meta
      property="og:description"
      content="Pizzas artisanales maison, base tomate ou crème, sur place, à emporter ou en livraison à Lillebonne. Appelez pour commander."
    />
    <meta property="og:url" content="https://darik76.github.io/pizza-bona-site/" />
    <meta property="og:image" content="https://darik76.github.io/pizza-bona-site/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pizza Bona — pizzeria artisanale à Lillebonne"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pizza Bona — Pizzeria artisanale à Lillebonne" />
    <meta
      name="twitter:description"
      content="Pizzas artisanales maison, base tomate ou crème, sur place, à emporter ou en livraison à Lillebonne."
    />
    <meta name="twitter:image" content="https://darik76.github.io/pizza-bona-site/og-image.webp" />

    <!-- Les polices (Anton, Fraunces, Outfit) sont servies avec le site, pas
         depuis Google Fonts : une connexion externe en moins, et aucune adresse
         IP de visiteur transmise à un tiers. Elles sont déclarées dans
         src/polices.css et régénérées par scripts/telecharger-polices.mjs. -->

    <!-- Schema.org LocalBusiness/Restaurant — données synchronisées manuellement avec
         src/config/site.ts ; mets à jour les deux si l'adresse, le téléphone ou les
         horaires changent.

         ⚠️ NE PAS ajouter ici de "aggregateRating" (note en étoiles) : Google
         considère qu'une note qu'un commerce publie lui-même sur son propre site
         est "auto-promotionnelle". Cela rend le site inéligible aux résultats
         enrichis et peut déclencher une pénalité manuelle. Les étoiles affichées
         dans Google viennent automatiquement de la fiche Google Business, pas d'ici.
         Réf : https://developers.google.com/search/docs/appearance/structured-data/review-snippet -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Pizza Bona",
        "servesCuisine": ["Pizza", "Italienne", "Pâtes"],
        "priceRange": "€€",
        "telephone": "+33235397914",
        "url": "https://darik76.github.io/pizza-bona-site/",
        "image": "https://darik76.github.io/pizza-bona-site/og-image.webp",
        "logo": "https://darik76.github.io/pizza-bona-site/images/logo.webp",
        "hasMenu": "https://darik76.github.io/pizza-bona-site/#carte",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "2 Rue Victor Hugo",
          "postalCode": "76170",
          "addressLocality": "Lillebonne",
          "addressCountry": "FR"
        },
        "areaServed": {
          "@type": "City",
          "name": "Lillebonne"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Tuesday", "opens": "11:00", "closes": "14:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Tuesday", "opens": "18:00", "closes": "21:30" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Wednesday", "opens": "11:00", "closes": "14:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Wednesday", "opens": "18:00", "closes": "21:30" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Thursday", "opens": "11:00", "closes": "14:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Thursday", "opens": "18:00", "closes": "21:30" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Friday", "opens": "11:00", "closes": "14:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Friday", "opens": "18:00", "closes": "21:30" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "11:00", "closes": "14:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "18:00", "closes": "21:30" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "18:00", "closes": "21:30" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

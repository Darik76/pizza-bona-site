    <!-- Schema.org LocalBusiness/Restaurant — données synchronisées manuellement avec

         ⚠️ NE PAS ajouter ici de "aggregateRating" (note en étoiles) : Google
         considère qu'une note qu'un commerce publie lui-même sur son propre site
         est "auto-promotionnelle". Cela rend le site inéligible aux résultats
         enrichis et peut déclencher une pénalité manuelle. Les étoiles affichées
         dans Google viennent automatiquement de la fiche Google Business, pas d'ici.
         Réf : https://developers.google.com/search/docs/appearance/structured-data/review-snippet -->
